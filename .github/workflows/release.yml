# Builds the Snake binary on GitHub and publishes it as a release when a v* tag is pushed.
# The commit being released has already passed ci.yml (barthelona verify) on main.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm
      - name: Assemble and link (static, no libc)
        run: |
          mkdir build
          for module in main input game render; do
            nasm -f elf64 -o "build/$module.o" "snake/$module.asm"
          done
          ld -z noexecstack -e _start -o build/snake-linux-x86_64 build/main.o build/input.o build/game.o build/render.o
      - name: Check the artifact without running it
        run: |
          file build/snake-linux-x86_64
          file build/snake-linux-x86_64 | grep -q "ELF 64-bit LSB executable, x86-64"
          cd build
          sha256sum snake-linux-x86_64 | tee snake-linux-x86_64.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" build/snake-linux-x86_64 build/snake-linux-x86_64.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Snake $TAG" --notes-file .github/release-notes.md
